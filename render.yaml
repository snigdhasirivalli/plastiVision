services:
  - type: web
    name: plastivision-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 2 --worker-class gthread
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
